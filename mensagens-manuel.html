<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Caveat:wght@500;600&family=Gilda+Display&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --walnut:#3a2318; --oak:#5b3826; --tan:#b88a5e; --ember:#c4621d; --ember-dark:#9e4c13;
    --paper:#fffdf9; --cream:#f6ecdc; --ink:#2b1c14; --muted:#7a6558; --line:#e7dccf;
    --kraft:#ead8bf; --kraft-2:#e1cba9; --kraft-3:#d6bd97;
    --display:"Gilda Display", Georgia, serif; --script:"Allura","Brush Script MT",cursive;
    --hand:"Caveat","Segoe Print",cursive; --body:"Jost",system-ui,sans-serif;
    --wood:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='300'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.42' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0 0.02  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>") 0 0/600px 300px,
      linear-gradient(176deg,#4a2b1d 0%,#3a2318 45%,#2c190f 100%);

  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:400 17px/1.6 var(--body);color:var(--ink);background:var(--cream)}
  body.locked{overflow:hidden}
  [hidden]{display:none !important}
  img{display:block;max-width:100%}

  /* =========================== ENVELOPE =========================== */
  .intro{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:var(--wood);padding:24px;
    transition:opacity var(--t-fade,1s) ease, visibility 0s var(--t-fade,1s);
  }
  .intro.is-gone{opacity:0;visibility:hidden}
  .intro__inner{display:grid;justify-items:center;gap:26px}
  .env-btn{background:none;border:0;padding:0;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
  .env{
    position:relative;width:min(86vw,460px);aspect-ratio:3/2;
    perspective:1400px;margin-top:20vh;
  }
  .env__back{position:absolute;inset:0;background:var(--kraft-3);border-radius:6px;box-shadow:0 26px 50px rgba(0,0,0,.5)}
  .env__letter{
    position:absolute;left:5%;right:5%;top:5%;bottom:5%;z-index:2;
    background:var(--paper);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.18);
    text-align:center;padding:7% 8% 0;color:var(--ink);
    transition:transform var(--t-letter,1.6s) cubic-bezier(.22,.9,.25,1) var(--t-letter-delay,1s);
  }
  .env__letter small{display:block;font:500 14px/1.3 var(--body);color:var(--muted)}
  .env__letter .t{font-family:var(--display);color:var(--tan);font-size:clamp(15px,3.6vw,20px);margin-top:4px}
  .env__letter .n{font-family:var(--script);font-size:clamp(34px,9vw,56px);line-height:1.05;color:var(--walnut);margin:2px 0 4px;white-space:nowrap}
  .env__letter .d{font:500 clamp(13px,3.2vw,15px)/1.3 var(--body);color:var(--ember-dark)}
  .env__pocket{
    position:absolute;inset:0;z-index:3;border-radius:6px;
    background:linear-gradient(160deg,var(--kraft) 0%,var(--kraft-2) 100%);
    clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);
  }
  .env__pocket::after{
    content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--kraft-2),#e6d2b2);
    clip-path:polygon(0 100%,50% 50%,100% 100%);
  }
  .env__to{
    position:absolute;z-index:4;left:0;right:0;bottom:5%;text-align:center;
    font-family:var(--script);font-size:clamp(26px,6.4vw,38px);color:var(--oak);
    transition:opacity .4s;
  }
  .env__flap{
    position:absolute;left:0;right:0;top:0;height:58%;z-index:5;
    background:linear-gradient(180deg,#e4cba6 0%,#d4b68b 100%);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:50% 0;transform:rotateX(0deg);
    transition:transform var(--t-flap,1s) cubic-bezier(.5,0,.6,1), z-index 0s var(--t-flap-half,.5s);
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.15));
  }
  .seal{
    position:absolute;z-index:6;left:50%;top:58%;width:68px;height:68px;margin:-34px 0 0 -34px;
    border-radius:50%;display:grid;place-items:center;color:#fff;
    background:radial-gradient(circle at 38% 32%,#dc7a35,var(--ember) 52%,var(--ember-dark) 100%);
    box-shadow:0 4px 10px rgba(0,0,0,.35), inset 0 0 0 5px rgba(0,0,0,.08);
    font-family:var(--script);font-size:44px;line-height:1;padding-top:6px;
    transition:opacity .25s, transform .35s;
  }
  .intro__hint{color:#ead9c8;font-size:16px;margin:0;text-align:center}
  .intro__skip{
    position:absolute;top:16px;right:16px;background:none;border:1px solid rgba(255,255,255,.3);
    color:#ead9c8;border-radius:999px;padding:6px 14px;font:500 14px var(--body);cursor:pointer;
  }
  /* aberto */
  .intro.is-open .seal{opacity:0;transform:scale(.6)}
  .intro.is-open .env__flap{transform:rotateX(180deg);z-index:1}
  .intro.is-open .env__letter{transform:translateY(-72%)}
  .intro.is-open .env__to,.intro.is-open .intro__hint{opacity:0}
  .intro__hint{transition:opacity .3s}
  .intro__go{
    background:var(--ember);color:#fff;border:0;border-radius:999px;padding:12px 26px;
    font:600 17px var(--body);cursor:pointer;box-shadow:0 5px 0 var(--ember-dark);
    opacity:0;transform:translateY(6px);transition:opacity .5s, transform .5s;pointer-events:none;
  }
  .intro__go.is-ready{opacity:1;transform:none;pointer-events:auto}
  @media (prefers-reduced-motion:no-preference){
    .intro:not(.is-open) .seal{animation:pulse 2.4s ease-in-out 1.2s infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  }
  @media (prefers-reduced-motion:reduce){
    .env__flap,.env__letter,.seal,.intro{transition:none}
  }

  
  /* A aba abre "achatando" em 2D (scaleY) em vez de rodar em 3D:
     assim é sempre um triângulo e nunca parece um retângulo a meio. */
  .env__pocket,.env__flap,.e-pocket,.e-flap{clip-path:none !important;-webkit-clip-path:none !important;background:none !important;filter:none !important;display:block;width:100%}
  .env__pocket::after{display:none}
  .env__pocket,.e-pocket{height:100%}
  .env__flap{transform:scaleY(1)}
  .intro.is-open .env__flap{transform:scaleY(-1)}
  /* a carta sobe só até meio, para a aba aberta ficar visível por trás em triângulo */
  .intro.is-open .env__letter{transform:translateY(-38%)}

  /* ---------- TOPO ---------- */
  .top{max-width:1080px;margin:0 auto;padding:44px 22px 56px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
  .eyebrow{font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--tan)}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.6vw,50px);line-height:1;margin:12px 0 0;color:var(--walnut)}
  h1 .nm{display:block;font-family:var(--script);font-size:clamp(78px,11vw,130px);line-height:.95;color:var(--ember);margin:2px 0 8px}
  .lead{font-size:18px;color:var(--muted);max-width:40ch;margin:0}
  .photo{background:#fff;padding:12px 12px 46px;border-radius:3px;transform:rotate(2deg);position:relative;margin:0;
    box-shadow:0 18px 40px rgba(58,35,24,.2),0 2px 6px rgba(58,35,24,.12)}
  .photo img{width:100%;border-radius:2px}
  .photo figcaption{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--hand);font-size:25px;color:#5b4a3e}
  .tape{position:absolute;width:110px;height:28px;background:rgba(234,216,191,.85);top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* ---------- MESA DE ENVELOPES ---------- */
  .table{background:var(--wood);color:#ead9c8;padding:56px 22px 70px}
  .table-in{max-width:1080px;margin:0 auto}
  .table h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,38px);color:#fff;margin:0;text-align:center}
  .table .sub{text-align:center;margin:6px 0 0;color:#d9c4b2}
  .count{display:flex;justify-content:center;gap:6px;margin:18px 0 38px;flex-wrap:wrap}
  .count i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);transition:background .4s}
  .count i.on{background:var(--ember)}

  .mail{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 26px}
  .e{ /* envelope pequeno */
    --r:0deg; position:relative;aspect-ratio:7/5;margin-top:30%;min-width:0;width:100%;border:0;padding:0;cursor:pointer;background:none;
    transform:rotate(var(--r));transition:transform .25s cubic-bezier(.3,1.4,.5,1);perspective:800px;
    -webkit-tap-highlight-color:transparent;font:inherit;
  }
  .e:hover,.e:focus-visible{transform:rotate(0) translateY(-6px) scale(1.04);outline:none}
  .e:focus-visible .e-body{box-shadow:0 0 0 3px var(--ember),0 14px 24px rgba(0,0,0,.45)}
  .e-body{position:absolute;inset:0;border-radius:5px;background:var(--kraft-3);box-shadow:0 12px 22px rgba(0,0,0,.4)}
  .e-paper{position:absolute;z-index:1;left:7%;right:7%;top:8%;bottom:8%;background:var(--paper);border-radius:3px;transition:transform .5s .15s}
  .e-pocket{position:absolute;z-index:2;inset:0;border-radius:5px;background:linear-gradient(160deg,var(--kraft),var(--kraft-2));
    clip-path:polygon(0 0,50% 46%,100% 0,100% 100%,0 100%)}
  .e-flap{position:absolute;left:0;right:0;top:0;height:48%;transform-origin:50% 0;border-radius:5px 5px 0 0;
    background:linear-gradient(180deg,#e4cba6,#d4b68b);clip-path:polygon(0 0,100% 0,50% 100%);
    transition:transform .5s, z-index 0s .25s;z-index:3;filter:drop-shadow(0 2px 1px rgba(0,0,0,.12))}
  .e-seal{position:absolute;z-index:4;left:50%;top:46%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    display:grid;place-items:center;color:#fff;font-family:var(--script);font-size:28px;padding-top:4px;
    background:radial-gradient(circle at 38% 32%,#dc7a35,var(--ember) 52%,var(--ember-dark));
    box-shadow:0 3px 6px rgba(0,0,0,.35);transition:opacity .3s, transform .3s}
  .e-name{position:absolute;z-index:4;left:5%;right:5%;bottom:9%;overflow:hidden;text-align:center;font-family:var(--script);
    font-size:clamp(25px,2.4vw,31px);line-height:1;color:var(--oak);white-space:nowrap}
  .e-done{position:absolute;z-index:5;top:-10px;right:-8px;background:var(--paper);color:var(--ember-dark);font-size:12px;font-weight:600;
    padding:3px 9px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.3);transform:scale(0) rotate(8deg);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  /* aberto (já lido) */
  .e.read .e-flap{transform:scaleY(-1);z-index:0}
  .e.read .e-seal{opacity:0;transform:scale(.5)}
  .e.read .e-done{transform:scale(1) rotate(8deg)}

  .final{max-width:620px;margin:50px auto 0;text-align:center;display:none}
  .final.show{display:block;animation:rise .7s cubic-bezier(.3,1.3,.5,1)}
  .final p{font-family:var(--script);font-size:clamp(40px,6vw,58px);line-height:1.05;color:#fff;margin:0}
  .final small{display:block;color:#d9c4b2;font-size:16px;margin-top:10px}

  .reset-wrap{text-align:center;margin-top:34px}
  .reset{font:500 15px var(--body);color:#ead9c8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);
    border-radius:99px;padding:9px 20px;cursor:pointer;transition:background .2s,border-color .2s}
  .reset:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.6)}
  footer{text-align:center;padding:34px 20px 40px;font-family:var(--script);font-size:40px;color:var(--oak)}

  /* ---------- CARTA ABERTA ---------- */
  .overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(28,16,10,.72);backdrop-filter:blur(4px)}
  .overlay.open{display:flex}
  .stage{width:min(640px,100%);position:relative}
  .big-env{position:relative;width:min(80vw,440px);aspect-ratio:7/5;margin:0 auto;perspective:1400px;transition:opacity .45s, transform .45s}
  .big-env .e-body{box-shadow:0 30px 60px rgba(0,0,0,.55)}
  .big-env .e-flap{transition:transform .7s cubic-bezier(.5,0,.6,1), z-index 0s .35s}
  .big-env .e-paper{transition:transform .8s cubic-bezier(.22,.9,.25,1) .45s}
  .big-env .e-seal{width:62px;height:62px;margin:-31px 0 0 -31px;font-size:42px}
  .big-env .e-name{font-size:clamp(30px,6vw,42px)}
  .big-env.opening .e-flap{transform:scaleY(-1);z-index:0}
  .big-env.opening .e-paper{transform:translateY(-30%)}
  .big-env.opening .e-seal{opacity:0;transform:scale(.5)}
  .big-env.gone{opacity:0;transform:translateY(40px) scale(.94)}

  .letter{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    background:var(--paper);border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.5);
    padding:40px 44px 30px;max-height:calc(100vh - 140px);display:flex;flex-direction:column;
    opacity:0;pointer-events:none;transition:opacity .45s, transform .6s cubic-bezier(.22,1.2,.3,1)}
  .letter.show{opacity:1;pointer-events:auto}
  .letter.pre{transform:translateY(-38%) scale(.86)}
  .letter::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:3px;pointer-events:none}
  .l-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .l-seal{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--script);font-size:32px;padding-top:4px;
    background:radial-gradient(circle at 38% 32%,#dc7a35,var(--ember) 52%,var(--ember-dark));box-shadow:0 3px 6px rgba(0,0,0,.25)}
  .l-head small{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tan)}
  .l-head b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--walnut);line-height:1.2}
  .l-text{overflow:auto;font-family:var(--hand);font-size:clamp(23px,2.9vw,28px);line-height:1.35;color:#2f2219;white-space:pre-line;
    padding:6px 4px 4px 0;
    background-image:repeating-linear-gradient(180deg,transparent 0 calc(1.35em - 1px),rgba(184,138,94,.28) calc(1.35em - 1px) 1.35em);
    background-attachment:local}
  .l-sign{font-family:var(--script);font-size:46px;line-height:1;color:var(--ember-dark);text-align:right;margin-top:10px}
  .l-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);gap:10px}
  .l-nav button{font:500 15px var(--body);color:var(--oak);background:none;border:1px solid var(--line);border-radius:99px;padding:7px 16px;cursor:pointer}
  .l-nav button:hover{border-color:var(--ember);color:var(--ember-dark)}
  .l-nav span{font-size:14px;color:var(--muted)}
  .x{position:absolute;top:-16px;right:-12px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
    background:var(--paper);color:var(--walnut);font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.35);display:none}
  .letter.show .x{display:block}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  @media (max-width:760px){
    .top{grid-template-columns:1fr;gap:28px;padding-top:32px}
    .photo{transform:rotate(1deg)}
    .mail{grid-template-columns:repeat(2,1fr);gap:4px 16px}
    .e-name{font-size:24px}
    .e-seal{width:30px;height:30px;margin:-15px 0 0 -15px;font-size:21px}
    .letter{padding:30px 24px 20px}
    .l-sign{font-size:40px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  const intro=$("intro"), reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (E.mostrar === false){ intro.remove(); document.body.classList.remove("locked"); return; }
  const tt=E.tempos||{}, num=(v,d)=>typeof v==="number"&&v>=0?v:d;
  const T={flap:num(tt.abrirAba,1),wait:num(tt.esperaAntesDaCarta,.3),up:num(tt.subirCarta,1.8),show:num(tt.cartaVisivel,2.6),fade:num(tt.desvanecer,1.2)}, delay=T.flap*.85+T.wait;
  const set=(k,v)=>intro.style.setProperty(k,v+"s");
  set("--t-flap",T.flap);set("--t-flap-half",T.flap/2);set("--t-letter",T.up);set("--t-letter-delay",delay);set("--t-fade",T.fade);
  let opened=false,left=false;
  function leave(){ if(left)return; left=true; document.body.classList.remove("locked"); window.scrollTo(0,0);
    if(reduce) intro.style.setProperty("--t-fade","0s");
    intro.classList.add("is-gone"); setTimeout(()=>intro.remove(),(reduce?0:T.fade*1000)+100); }
  $("env-btn").onclick=()=>{ if(opened)return; opened=true; intro.classList.add("is-open");
    setTimeout(leave, reduce?0:(delay+T.up+T.show)*1000); };
  $("skip").onclick=()=>{ opened=true; intro.classList.add("is-open"); leave(); };
})();

/* mesa de envelopes */
const mail = $("mail"), dots = $("dots");
MSGS.forEach((m,i)=>{
  const b=document.createElement("button");
  b.className="e"; b.style.setProperty("--r", (((i*53)%9)-4)*0.7+"deg");
  b.setAttribute("aria-label","Carta de "+m.nome);
  b.innerHTML=`<div class="e-body"></div><div class="e-paper"></div><svg class="e-pocket" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,0 150,92 300,0 300,200 0,200" fill="url(#gPocket)"/><polygon points="0,200 150,100 300,200" fill="url(#gBottom)"/></svg><svg class="e-flap" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,0 300,0 150,100" fill="url(#gFlap)"/><polyline points="0,0 150,100 300,0" fill="none" stroke="rgba(120,80,40,.18)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>
    <div class="e-seal"></div><div class="e-name"></div><span class="e-done"></span>`;
  b.querySelector(".e-seal").textContent=initial(m);
  b.querySelector(".e-done").textContent=C.marcaLida||"✓ lida";
  b.querySelector(".e-name").textContent=m.nome;
  b.onclick=()=>open(i,C.abrirComAnimacao!==false);
  mail.appendChild(b);
  dots.appendChild(document.createElement("i"));
});

function refresh(){
  [...mail.children].forEach((b,i)=>b.classList.toggle("read",read.has(i)));
  [...dots.children].forEach((d,i)=>d.classList.toggle("on",read.has(i)));
  $("final").classList.toggle("show",read.size===MSGS.length);
  $("reset").hidden = read.size===0;
}

function fillLetter(i){
  const m=MSGS[i];
  $("lSeal").textContent=initial(m); $("lFrom").textContent=m.nome;
  $("lText").textContent=m.texto; $("lText").scrollTop=0;
  $("lSign").textContent=(m.assinatura!=null?m.assinatura:m.nome.split(" ")[0]);
  $("pos").textContent=`${i+1} ${C.separadorContagem||"de"} ${MSGS.length}`;
}

function clear(){ timers.forEach(clearTimeout); timers=[]; }
function open(i,animate){
  clear(); cur=i;
  const env=$("bigEnv"), letter=$("letter"), m=MSGS[i];
  $("overlay").classList.add("open");
  fillLetter(i);
  read.add(i); refresh();
  if(!animate || matchMedia("(prefers-reduced-motion: reduce)").matches){
    env.style.display="none"; letter.classList.remove("pre"); letter.classList.add("show"); return;
  }
  // 1) envelope fechado com nome  2) abre e a carta sobe  3) carta aparece em grande
  env.style.display=""; env.className="big-env"; letter.className="letter pre";
  $("bSeal").textContent=initial(m); $("bName").textContent=m.nome;
  timers.push(setTimeout(()=>env.classList.add("opening"),350));
  timers.push(setTimeout(()=>{ env.classList.add("gone"); letter.classList.add("show"); },1600));
  timers.push(setTimeout(()=>letter.classList.remove("pre"),1650));
  timers.push(setTimeout(()=>{ env.style.display="none"; },2100));
}
function close(){ clear(); $("overlay").classList.remove("open"); $("letter").className="letter"; }
function step(d){ open((cur+d+MSGS.length)%MSGS.length,false); }

$("close").onclick=close;
$("reset").onclick=()=>{ read.clear(); refresh(); };
$("overlay").onclick=e=>{ if(e.target.id==="overlay"||e.target.classList.contains("stage")) close(); };
$("prev").onclick=()=>step(-1); $("next").onclick=()=>step(1);
document.addEventListener("keydown",e=>{
  if(!$("overlay").classList.contains("open")) return;
  if(e.key==="Escape") close(); if(e.key==="ArrowRight") step(1); if(e.key==="ArrowLeft") step(-1);
});
/* encolhe nomes compridos para caberem no envelope */
function fit(){ document.querySelectorAll(".e-name").forEach(el=>{ el.style.fontSize="";
  let s=parseFloat(getComputedStyle(el).fontSize); while(el.scrollWidth>el.clientWidth && s>14){ s-=1; el.style.fontSize=s+"px"; } }); }
addEventListener("resize",fit); document.fonts && document.fonts.ready.then(fit); fit();
refresh();
</script>
